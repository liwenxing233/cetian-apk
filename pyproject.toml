# This project was generated with 0.4.7 using template: https://github.com/beeware/briefcase-template @ v0.4.7
[tool.briefcase]
project_name = "cetian_beeware"
bundle = "com.cetian.beeware"
version = "0.0.1"
url = "https://beeware.cetian.com/cetian_beeware"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
author = "lwx"
author_email = "123456789"

[tool.briefcase.app.cetian_beeware]
formal_name = "策天十八飞星"
description = "策天十八飞星紫微斗数排盘"
long_description = """More details about the app should go here.
"""
sources = [
    "src/cetian_beeware",
]
test_sources = [
    "tests",
]

requires = [
    "lunar-python==1.4.9",
]
test_requires = [
    "pytest",
]

[tool.briefcase.app.cetian_beeware.macOS]
universal_build = true
requires = [
    "toga-cocoa~=0.5.0",
    "std-nslog~=2.0.0",
]

[tool.briefcase.app.cetian_beeware.linux]
requires = [
    "toga-gtk~=0.5.0",
]

[tool.briefcase.app.cetian_beeware.linux.system.debian]
system_requires = [
    # Needed to compile pycairo wheel
    "libcairo2-dev",
    "libgirepository-2.0-dev",
]

system_runtime_requires = [
    # Needed to provide GTK and its GI bindings
    "gir1.2-gtk-3.0",
    "libgirepository-2.0-0",
    # Dependencies that GTK looks for at runtime
    "libcanberra-gtk3-module",
]

[tool.briefcase.app.cetian_beeware.linux.system.rhel]
system_requires = [
    # Needed to compile pycairo wheel
    "cairo-gobject-devel",
    # Needed to compile PyGObject wheel
    "gobject-introspection-devel",
]

system_runtime_requires = [
    # Needed to support Python bindings to GTK
    "gobject-introspection",
    # Needed to provide GTK
    "gtk3",
    # Dependencies that GTK looks for at runtime
    "libcanberra-gtk3",
]

[tool.briefcase.app.cetian_beeware.linux.system.suse]
system_requires = [
    # Needed to compile pycairo wheel
    "cairo-devel",
    # Needed to compile PyGObject wheel
    "gobject-introspection-devel",
]

system_runtime_requires = [
    # Needed to provide GTK
    "gtk3",
    # Needed to support Python bindings to GTK
    "gobject-introspection", "typelib(Gtk) = 3.0",
    # Dependencies that GTK looks for at runtime
    "libcanberra-gtk3-module",
]

[tool.briefcase.app.cetian_beeware.linux.system.arch]
system_requires = [
    # Needed to compile pycairo wheel
    "cairo",
    # Needed to compile PyGObject wheel
    "gobject-introspection",
    # Needed to provide GTK
    "gtk3",
    # Dependencies that GTK looks for at runtime
    "libcanberra",
]

system_runtime_requires = [
    # Needed to provide GTK
    "gtk3",
    # Needed to provide PyGObject bindings
    "gobject-introspection-runtime",
    # Dependencies that GTK looks for at runtime
    "libcanberra",
]

[tool.briefcase.app.cetian_beeware.linux.appimage]
manylinux = "manylinux_2_28"

system_requires = [
    # Needed to compile pycairo wheel
    "cairo-gobject-devel",
    # Needed to compile PyGObject wheel
    "gobject-introspection-devel",
    # Needed to provide GTK
    "gtk3-devel",
    # Dependencies that GTK looks for at runtime, that need to be
    # in the build environment to be picked up by linuxdeploy
    "libcanberra-gtk3",
    "PackageKit-gtk3-module",
    "gvfs-client",
]

linuxdeploy_plugins = [
    "DEPLOY_GTK_VERSION=3 gtk",
]

[tool.briefcase.app.cetian_beeware.linux.flatpak]
flatpak_runtime = "org.gnome.Platform"
flatpak_runtime_version = "48"
flatpak_sdk = "org.gnome.Sdk"

[tool.briefcase.app.cetian_beeware.windows]
requires = [
    "toga-winforms~=0.5.0",
]

# Mobile deployments
[tool.briefcase.app.cetian_beeware.iOS]
requires = [
    "toga-iOS~=0.5.0",
]

[tool.briefcase.app.cetian_beeware.android]
requires = [
    "toga-android~=0.5.0",
]

base_theme = "Theme.MaterialComponents.Light.DarkActionBar"

build_gradle_dependencies = [
    "com.google.android.material:material:1.13.0",
]

[tool.briefcase.app.cetian_beeware.web]
requires = [
    "toga-web~=0.5.0",
]